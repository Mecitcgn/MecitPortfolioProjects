<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Menubar</title>
		<style>
			*,
			*::before,
			*::after {
				margin: 0;
				padding: 0;

				box-sizing: border-box;
			}
			body {
				width: 100%;
				height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			ul {
				list-style: none;
			}

			.menu ul {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 2rem;
			}
			.ikiboyut {
				position: relative;
				cursor: pointer;
			}
			.ikiboyut:hover ul {
				display: flex;
			}
			.ikiboyut ul {
				position: absolute;
				display: none;
				flex-direction: column;
				gap: 1rem;
				background-color: yellow;
			}
		</style>
	</head>
	<body>
		<div class="menu">
			<ul>
				<li>Ana sayfa</li>
				<li class="ikiboyut">
					hakkımızda
					<ul>
						<li>Menüİçi</li>
						<li>Menüİçi</li>
						<li>Menüİçi</li>
					</ul>
				</li>
				<li>where</li>
				<li>iletişim</li>
			</ul>
		</div>
	</body>
</html>
