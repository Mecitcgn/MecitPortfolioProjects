<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Availability Table</title>
  <link rel="stylesheet" href="AvailabilityTableFreeC.css">
</head>

<body>
  <!-- Legend -->
  <div id="legend">
    <span>Availability</span>
    <div id="legend-gradient" aria-hidden="true"></div>
  </div>

  <!-- Schedule table -->
  <table>
    <thead>
      <tr>
        <th scope="col" aria-hidden="true"></th>
        <th scope="col">Monday</th>
        <th scope="col">Tuesday</th>
        <th scope="col">Wednesday</th>
        <th scope="col">Thursday</th>
        <th scope="col">Friday</th>
      </tr>
    </thead>
    <tbody>
      <tr class="sharp">
        <th class="time" scope="row">08:00</th>
        <td class="available-1">1</td>
        <td class="available-3">3</td>
        <td class="available-2">2</td>
        <td class="available-0">0</td>
        <td class="available-4">4</td>
      </tr>

      <tr class="half">
        <th class="time" scope="row">09:00</th>
        <td class="available-2">2</td>
        <td class="available-5">5</td>
        <td class="available-1">1</td>
        <td class="available-3">3</td>
        <td class="available-0">0</td>
      </tr>

      <tr class="sharp">
        <th class="time" scope="row">10:00</th>
        <td class="available-4">4</td>
        <td class="available-2">2</td>
        <td class="available-3">3</td>
        <td class="available-1">1</td>
        <td class="available-5">5</td>
      </tr>

      <tr class="half">
        <th class="time" scope="row">11:00</th>
        <td class="available-0">0</td>
        <td class="available-1">1</td>
        <td class="available-4">4</td>
        <td class="available-2">2</td>
        <td class="available-3">3</td>
      </tr>

      <tr class="sharp">
        <th class="time" scope="row">12:00</th>
        <td class="available-5">5</td>
        <td class="available-0">0</td>
        <td class="available-2">2</td>
        <td class="available-4">4</td>
        <td class="available-1">1</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
