<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/fontawesome.min.css" />
		<link rel="stylesheet" href="style5.css" />
		<title>Profile Header</title>
	</head>
	<body>
		<div class="profile-card">
			<div class="left-side">
				<img src="FriendImage.png" alt="" />
				<p class="profile-name">MetaMask</p>
				<p class="profile-at">@metaMask</p>
				<p class="description">MetaMask brings Ethereum to your web browser</p>
				<div class="flex-icons">
					<div class="social-media-icon-container">
						<i class="fa-brands fa-github social-media-icon"></i>
					</div>
					<div class="social-media-icon-container">
						<i class="fa-brands fa-linkedin social-media-icon"></i>
					</div>
					<div class="social-media-icon-container">
						<i class="fa-brands fa-instagram social-media-icon"></i>
					</div>
					<div class="social-media-icon-container">
						<i class="fa-brands fa-twitter social-media-icon"></i>
					</div>
				</div>
			</div>
			<div class="right-side">
				<div class="progress-container">
					<div class="progress-text-container">
						<p class="org-text">6/8 Organizations</p>
						<i class="fa fa-info-circle"></i>
					</div>
					<input type="range" value="80" min="0" max="100" id="bar" />
				</div>
				<div class="button-container">
					<p class="follower-count"><span>4K</span> Followers</p>
					<button class="follow-button">Follow</button>
				</div>
			</div>
		</div>
	</body>
</html>
