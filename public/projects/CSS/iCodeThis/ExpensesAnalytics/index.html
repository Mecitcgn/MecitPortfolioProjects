<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Expenses Analytics</title>
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.css" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="mainCard">
			<div class="cardContent">
				<header class="headerCard">
					<div class="headerLeftContainer">
						<h1 class="headerCardTitle">Expenses</h1>
						<div class="headerCardTimeline">
							<p class="headerCardTimeText">Weekly</p>
							<p class="headerCardTimeText">Monthly</p>
							<p class="headerCardTimeText">Yearly</p>
						</div>
					</div>
					<div class="headerRightContainer">
						<i class="fa fa-circle"></i>
						<i class="fa fa-circle"></i>
						<i class="fa fa-circle"></i>
					</div>
				</header>
				<main class="cardAnalytic">
					<div class="analyticContainer">
						<div class="repeatingLinesContainer">
							<div class="repeatingHorizontalLines">
								<div class="lineHorCont">
									<div class="line"></div>
									<p class="lineNumber">4k</p>
								</div>
								<div class="lineHorCont">
									<div class="line"></div>
									<p class="lineNumber">3k</p>
								</div>
								<div class="lineHorCont">
									<div class="line"></div>
									<p class="lineNumber">2k</p>
								</div>
								<div class="lineHorCont">
									<div class="line"></div>
									<p class="lineNumber">1k</p>
								</div>
								<div class="lineHorCont">
									<div class="line"></div>
									<p class="lineNumber">0k</p>
								</div>
							</div>
							<div class="repeatingVerticalLines">
								
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Mon</div>
								</div>
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Tue</div>
								</div>
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Wed</div>
								</div>
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Thu</div>
								</div>
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Fri</div>
								</div>
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Sat</div>
								</div>
								<div class="verticalLineContainer">
									<div class="verticalLine">
										<div class="blueLine"></div>
										<div class="redLine"></div>
									</div>
									<div class="lineText">Sun</div>
								</div>
							</div>
						</div>
					</div>
				</main>
			</div>
		</div>
	</body>
</html>
