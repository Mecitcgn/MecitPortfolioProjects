<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/fontawesome.min.css" />

		<title>Buy Form</title>
		<style>
			/* 1. Use a more-intuitive box-sizing model */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			/* 2. Remove default margin */
			* {
				margin: 0;
			}

			/* 3. Enable keyword animations */
			@media (prefers-reduced-motion: no-preference) {
				html {
					interpolate-size: allow-keywords;
				}
			}

			body {
				/* 4. Add accessible line-height */
				line-height: 1.5;
				/* 5. Improve text rendering */
				-webkit-font-smoothing: antialiased;
			}

			/* 6. Improve media defaults */
			img,
			picture,
			video,
			canvas,
			svg {
				display: block;
				max-width: 100%;
			}

			/* 7. Inherit fonts for form controls */
			input,
			button,
			textarea,
			select {
				font: inherit;
			}

			/* 8. Avoid text overflows */
			p,
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				overflow-wrap: break-word;
			}

			/* 9. Improve line wrapping */
			p {
				text-wrap: pretty;
			}
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				text-wrap: balance;
			}

			/* 10. Create a root stacking context */
			#root,
			#__next {
				isolation: isolate;
			}

			:root {
				/* hsl (fallback color) */
				--bg-dark: hsl(336 0% 1%);
				--bg: hsl(330 0% 4%);
				--bg-light: hsl(0 0% 9%);
				--text: hsl(0 0% 95%);
				--text-muted: hsl(300 0% 69%);
				--highlight: hsl(330 0% 39%);
				--border: hsl(0 0% 28%);
				--border-muted: hsl(300 0% 18%);
				--primary: hsl(320 50% 73%);
				--secondary: hsl(149 41% 62%);
				--danger: hsl(9 26% 64%);
				--warning: hsl(52 19% 57%);
				--success: hsl(146 17% 59%);
				--info: hsl(217 28% 65%);
				/* oklch */
				--bg-dark: oklch(0.1 0 340);
				--bg: oklch(0.15 0 340);
				--bg-light: oklch(0.2 0 340);
				--text: oklch(0.96 0 340);
				--text-muted: oklch(0.76 0 340);
				--highlight: oklch(0.5 0 340);
				--border: oklch(0.4 0 340);
				--border-muted: oklch(0.3 0 340);
				--primary: oklch(0.76 0.1 340);
				--secondary: oklch(0.76 0.1 160);
				--danger: oklch(0.7 0.05 30);
				--warning: oklch(0.7 0.05 100);
				--success: oklch(0.7 0.05 160);
				--info: oklch(0.7 0.05 260);

				--shadow-s: inset 0 1px 2px #ffffff50, 0 1px 2px #ffffff30,
					0 2px 4px #ffffff15;
				--shadow-m: inset 0 2px 4px #ffffff50, 0 2px 4px #ffffff30,
					0 8px 12px #ffffff15;
				--shadow-l: inset 0 4px 8px #ffffff50, 0 4px 8px #ffffff30,
					0 16px 32px #ffffff15;
				--success-shadow-s: inset 0 1px 2px #00ff0050, 0 1px 2px #00ff0030,
					0 2px 4px #00ff0015;
				--success-shadow-m: inset 0 2px 4px #00ff0050, 0 2px 4px #00ff0030,
					0 8px 12px #00ff0015;
				--success-shadow-l: inset 0 4px 8px #00ff0050, 0 4px 8px #00ff0030,
					0 16px 32px #00ff0015;
				--danger-shadow-s: inset 0 1px 2px #ff000050, 0 1px 2px #ff000030,
					0 2px 4px #ff000015;
				--danger-shadow-m: inset 0 2px 4px #ff000050, 0 2px 4px #ff000030,
					0 8px 12px #ff000015;
				--danger-shadow-l: inset 0 4px 8px #ff000050, 0 4px 8px #ff000030,
					0 16px 32px #ff000015;
			}

			body.light {
				/* hsl (fallback color) */
				--bg-dark: hsl(0 0% 90%);
				--bg: hsl(0 0% 95%);
				--bg-light: hsl(300 50% 100%);
				--text: hsl(330 0% 4%);
				--text-muted: hsl(0 0% 28%);
				--highlight: hsl(300 50% 100%);
				--border: hsl(300 0% 50%);
				--border-muted: hsl(340 0% 62%);
				--primary: hsl(318 38% 30%);
				--secondary: hsl(160 100% 13%);
				--danger: hsl(9 21% 41%);
				--warning: hsl(52 23% 34%);
				--success: hsl(147 19% 36%);
				--info: hsl(217 22% 41%);
				/* oklch */
				--bg-dark: oklch(0.92 0 340);
				--bg: oklch(0.96 0 340);
				--bg-light: oklch(1 0 340);
				--text: oklch(0.15 0 340);
				--text-muted: oklch(0.4 0 340);
				--highlight: oklch(1 0 340);
				--border: oklch(0.6 0 340);
				--border-muted: oklch(0.7 0 340);
				--primary: oklch(0.4 0.1 340);
				--secondary: oklch(0.4 0.1 160);
				--danger: oklch(0.5 0.05 30);
				--warning: oklch(0.5 0.05 100);
				--success: oklch(0.5 0.05 160);
				--info: oklch(0.5 0.05 260);

				/* OKLCH */
				--bg-dark: oklch(0.92 0.055 73);
				--bg: oklch(0.96 0.055 73);
				--bg-light: oklch(1 0.055 73);
				--text: oklch(0.15 0.11 73);
				--text-muted: oklch(0.4 0.11 73);
				--highlight: oklch(1 0.11 73);
				--highlight-secondary: oklch(1 0.11 253);
				--border: oklch(0.6 0.11 73);
				--border-muted: oklch(0.7 0.11 73);
				--primary: oklch(0.4 0.11 73);
				--secondary: oklch(0.4 0.11 253);
				--danger: oklch(0.5 0.11 30);
				--warning: oklch(0.5 0.11 100);
				--success: oklch(0.5 0.11 160);
				--info: oklch(0.5 0.11 260);

				--shadow-s: inset 0 1px 2px #00000050, 0 1px 2px #00000030,
					0 2px 4px #00000015;
				--shadow-m: inset 0 2px 4px #00000050, 0 2px 4px #00000030,
					0 8px 12px #00000015;
				--shadow-l: inset 0 4px 8px #00000050, 0 4px 8px #00000030,
					0 16px 32px #00000015;
				--success-shadow-s: inset 0 1px 2px #00ff0050, 0 1px 2px #00ff0030,
					0 2px 4px #00ff0015;
				--success-shadow-m: inset 0 2px 4px #00ff0050, 0 2px 4px #00ff0030,
					0 8px 12px #00ff0015;
				--success-shadow-l: inset 0 4px 8px #00ff0050, 0 4px 8px #00ff0030,
					0 16px 32px #00ff0015;
				--danger-shadow-s: inset 0 1px 2px #ff000050, 0 1px 2px #ff000030,
					0 2px 4px #ff000015;
				--danger-shadow-m: inset 0 2px 4px #ff000050, 0 2px 4px #ff000030,
					0 8px 12px #ff000015;
				--danger-shadow-l: inset 0 4px 8px #ff000050, 0 4px 8px #ff000030,
					0 16px 32px #ff000015;
			}

			body {
				width: 100%;
				height: 100dvh;
				background-color: var(--bg-dark);
				display: flex;
				justify-content: center;
				align-items: center;
				color: var(--text);
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			}

			.main-container {
				width: 800px;
				height: 600px;
				background: radial-gradient(
					circle at center,
					var(--highlight) 0%,
					var(--bg) 70%
				);
				border-radius: 1rem;
				box-shadow: var(--shadow-l);
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.container {
				width: 90%;
				height: 90%;
				background-color: var(--bg-light);
				border-radius: 1rem;
				box-shadow: var(--shadow-s);
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.img-container {
				width: 40%;
				height: 100%;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				padding-block-start: 3rem;
			}
			.content-container {
				width: 60%;
				height: 100%;
				display: flex;
				justify-content: flex-start;
				align-items: flex-start;
				flex-direction: column;
				padding-block-start: 3rem;
				padding-inline-end: 4rem;
				gap: 0.75rem;
			}
			.header-item-container {
				display: flex;
				justify-content: flex-start;
				align-items: flex-start;
				gap: 1rem;
				flex-direction: column;
				padding-bottom: 1rem;
			}
			.shipping-container {
				width: auto;
				background-color: var(--bg-dark);
				border-radius: 2rem;
				padding: 0.3rem 1rem;
			}
			.header-item-container p:nth-child(1) {
				font-size: 0.875rem;
				color: var(--text-muted);
			}
			.header-item-container p:nth-child(2) {
				font-size: 1.375rem;
				font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
					'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
				font-weight: bold;
			}
			.price-container {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				flex-direction: column;
				gap: 0.1rem;
			}
			.price-container p:nth-child(1) {
				color: var(--text-muted);
			}
			.price-container p:nth-child(2) {
				font-size: 2.25rem;
				font-weight: bold;
			}
			.price-container p:nth-child(3) {
				color: var(--text-muted);
				font-size: 0.875rem;
			}
			.cart-container {
				height: 3rem;
				width: 100%;
				margin-top: 1rem;
			}

			.cart-btn {
				width: 100%;
				height: 100%;
				cursor: pointer;
				color: var(--bg);
				background-color: var(--primary);
				border: 2px solid var(--border);
				border-radius: 0.4rem;
				box-shadow: var(--shadow-m);
				transition: 0.3s ease all;
			}

			.stock-container {
				width: 100%;
				display: flex;
				align-items: center;
				gap: 0.5rem;
			}

			.stock-container i {
				color: var(--success);
			}
			.stock-container p {
				font-size: 0.875rem;
				padding-block: 0.5rem;
			}
			.buttons-container {
				width: 100%;
				height: 3.5rem;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.btn {
				width: 48%;
				height: 100%;
				background-color: var(--primary);
				border: 2px solid var(--border);
				box-shadow: var(--shadow-s);

				border-radius: 0.5rem;
				display: flex;
				justify-content: space-evenly;
				align-items: center;
				transition: 0.3s all ease;
				cursor: pointer;
			}

			.btn i {
				font-size: 1.5rem;
				color: var(--bg);
			}
			.btn p {
				font-size: 1.125rem;
				color: var(--bg);
			}
			.btn-secondary {
				background-color: var(--secondary);
			}
			.btn-hover:hover {
				background-color: var(--highlight);
				box-shadow: var(--shadow-l);
			}
			.btn-hover-secondary:hover {
				background-color: var(--highlight-secondary);
				box-shadow: var(--shadow-l);
			}
			.themeBtn {
				position: absolute;
				width: 150px;
				height: 50px;
				top: 2rem;
				right: 2rem;
				color: var(--bg);
			}
		</style>
	</head>
	<body>
		<button class="themeBtn btn btn-hover">Light Mode</button>
		<div class="main-container">
			<div class="container">
				<div class="img-container">
					<img src="Headphone.png" class="headphone-img" alt="" />
				</div>
				<div class="content-container">
					<div class="header-item-container">
						<div class="shipping-container">
							<p>Free shipping</p>
						</div>
						<p>Razer Kraken Kitty Edt Gaming Headset Quartz</p>
					</div>
					<div class="price-container">
						<p><del>1,599$</del></p>
						<p>799$</p>
						<p>The offer is valid until April 3 or as long as stock lasts!</p>
					</div>
					<div class="cart-container">
						<button class="btn-hover cart-btn">Add to cart</button>
					</div>
					<div class="stock-container">
						<i class="fa fa-check-circle"></i>
						<p class="stock-text">50% pcs. in stock.</p>
					</div>
					<div class="buttons-container">
						<button class="btn btn-hover">
							<i class="fa fa-truck"></i>
							<p class="cart-text">Add to cart</p>
						</button>
						<button class="btn btn-hover-secondary btn-secondary">
							<i class="fa fa-heart"></i>
							<p class="wishlist-text">Add to wishlist</p>
						</button>
					</div>
				</div>
			</div>
		</div>
		<script>
			const themeButton = document.querySelector('.themeBtn');
			const cartBtn = document.querySelector('.cart-btn');
			themeButton.addEventListener('click', () => {
				document.body.classList.toggle('light');

				themeButton.textContent = document.body.classList.contains('light')
					? 'Dark Mode'
					: 'Light Mode';
			});
		</script>
	</body>
</html>
