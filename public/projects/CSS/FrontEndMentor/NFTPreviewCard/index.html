<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NFT Preview Card</title>
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.css" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,400;0,600;1,200;1,400;1,600&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<button class="switchBtn">Light Mode</button>
		<div class="card">
			<div class="background-glow"></div>

			<div class="img-container">
				<img src="./images/image-equilibrium.jpg" alt="" />
			</div>
			<div class="desc-container">
				<h1>Equilibrium #3429</h1>
				<p class="desc">
					Our Equilibrium collection promotes balance and calm.
				</p>
				<div class="count-container">
					<div class="left-flex">
						<img src="./images/icon-ethereum.svg" alt="" />
						<p class="eth-cnt">0.041 ETH</p>
					</div>
					<div class="right-flex">
						<img src="./images/icon-clock.svg" alt="" />
						<p class="day-left">3 days left</p>
					</div>
				</div>
			</div>
			<hr />
			<div class="creator-container">
				<img src="./images/image-avatar.png" alt="" />
				<p>Creation of <span>Jules Wyvern</span></p>
			</div>
		</div>
		<script>
			const modeButton = document.querySelector('.switchBtn');
			modeButton.addEventListener('click', () => {
				document.body.classList.toggle('light');
				if (modeButton.textContent === 'Light Mode') {
					modeButton.textContent = 'Dark Mode';
				} else {
					modeButton.textContent = 'Light Mode';
				}
			});
		</script>
	</body>
</html>
