<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Huddle Landing Page</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,400;0,600;1,200;1,400;1,600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.css" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<style>
			/* 1. Use a more-intuitive box-sizing model */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			/* 2. Remove default margin */
			* {
				margin: 0;
			}

			/* 3. Enable keyword animations */
			@media (prefers-reduced-motion: no-preference) {
				html {
					interpolate-size: allow-keywords;
				}
			}

			body {
				/* 4. Add accessible line-height */
				line-height: 1.5;
				/* 5. Improve text rendering */
				-webkit-font-smoothing: antialiased;
			}

			/* 6. Improve media defaults */
			img,
			picture,
			video,
			canvas,
			svg {
				display: block;
				max-width: 100%;
			}

			/* 7. Inherit fonts for form controls */
			input,
			button,
			textarea,
			select {
				font: inherit;
			}

			/* 8. Avoid text overflows */
			p,
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				overflow-wrap: break-word;
			}

			/* 9. Improve line wrapping */
			p {
				text-wrap: pretty;
			}
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				text-wrap: balance;
			}

			/*
			  10. Create a root stacking context
			*/
			#root,
			#__next {
				isolation: isolate;
			}

			:root {
				--purple700: hsl(257, 40%, 49%);
				--magenta400: hsl(300, 69%, 71%);
				--poppins: 'Poppins', sans-serif;
			}

			body {
				width: 100%;
				height: 100dvh;
				display: flex;
				justify-content: center;
				align-items: center;
				background: url(./images/bg-desktop.svg),
					linear-gradient(90deg, var(--purple700) 70%, var(--magenta400));
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
				color: white;
				font-family: var(--poppins);
			}
			.main-title {
				position: absolute;
				top: 50px;
				left: 50px;
			}
			.bottom-infos {
				position: absolute;
				bottom: 40px;
				right: 60px;
				display: flex;
				gap: 16px;
				> * {
					display: flex;
					justify-content: center;
					align-items: center;
					border: 1px solid white;
					border-radius: 100%;
					padding: 0.5rem;
					font-size: 2rem;
					aspect-ratio: 1 / 1;
					color: hsl(0 0% 100%);
				}
			}

			.main-card {
				max-inline-size: 1200px;
				padding-inline: 2rem;
				margin-inline: auto;
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 3rem;
				> * {
					flex: 1;
				}
				.img-container {
					flex-grow: 1.2;
				}
				.text-container {
					h1 {
						font-size: 2.5rem;
						font-weight: bold;
						line-height: 1.2;
						margin-block-end: 1.5rem;
					}
					p {
						color: hsl(0 0% 90%);
						margin-block-end: 1rem;
					}
				}
				button {
					padding: 0.75rem 4rem;
					border-radius: 100vw;
					background-color: hsl(0 0 100%);
					color: var(--purple700);
					border: none;
					outline: none;
					box-shadow: 0 2px 10px hsl(0 0% 10%);
					cursor: pointer;
					transition: 0.3s ease all;
					&:hover {
						filter: opacity(0.8);
						transform: scale(0.95);
					}
				}
			}
			@media (width < 900px) {
				body {
					background: url(./images/bg-desktop.svg),
						linear-gradient(90deg, var(--purple700) 70%, var(--magenta400));
					background-size: cover;
					background-position: center;
					background-repeat: no-repeat;
				}
				.main-card {
					flex-direction: column;
					justify-content: center;
					align-items: center;
					text-align: center;
					margin-block-start: 6rem;
					> * {
						flex: 1 !important;
					}
				}
				.bottom-infos {
					position: static;
					text-align: center;
				}
			}
		</style>
	</head>
	<body>
		<div class="main-title">
			<img src="./images/logo.svg" alt="" />
		</div>
		<div class="main-card">
			<div class="img-container">
				<img src="./images/illustration-mockups.svg" alt="" />
			</div>
			<div class="text-container">
				<h1>Build The Community Your Fans Will Love</h1>
				<p>
					Huddle re-imagines the way we build communities. You have a voice, but
					so does your audience. Create connections with your users as you
					engage in genuine discussion
				</p>
				<button>Register</button>
			</div>
			<div class="bottom-infos">
				<div class="brand-container">
					<i class="fa-brands fa-facebook"></i>
				</div>
				<div class="brand-container">
					<i class="fa-brands fa-twitter"></i>
				</div>
				<div class="brand-container">
					<i class="fa-brands fa-instagram"></i>
				</div>
			</div>
		</div>
	</body>
</html>
