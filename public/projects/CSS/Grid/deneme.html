<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Deneme</title>
  <style>
    .grid-box {
      width: 100%;
      height: 100vh;
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "body"
        "foot"
        "nav";
    }

    .box:nth-child(1) {
      grid-area: header;
      background-color: yellow;
    }

    .box:nth-child(2) {
      grid-area: body;
      background-color: red;
    }

    .box:nth-child(3) {
      grid-area: foot;
      background-color: purple;
    }

    .box:nth-child(4) {
      grid-area: nav;
      background-color: blue;
    }

    @media (width > 400px) {
      .grid-box {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "header body"
          "foot nav";

      }
    }
  </style>
</head>

<body>
  <div class="grid-box">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</body>

</html>
