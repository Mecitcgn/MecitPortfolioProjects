<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<button id="openBtn" class="trigger-btn">Dialogu Aç</button>

		<dialog id="proDialog">

				<h2>Kusursuz Akış</h2>
				<p>
					Bu örnekte hem açılış hem de kapanış animasyonları CSS Keyframes ile

				</p>
				<div class="actions">
					<button id="closeBtn" class="close-btn">Vazgeç</button>
					<button class="primary-btn">Tamamdır</button>
				</div>
			</div>
		</dialog>
		<script src="script.js"></script>
	</body>
