<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<div class="img-container">
				<img src="freeCodeCampLogo.jpg" alt="" />
			</div>
			<div class="title-container">
				<h1>Is it a Palindrome?</h1>
			</div>
			<div class="input-container">
				<label for="inputPalindrome"
					>Enter in text to check for a palindrome:</label
				>
				<div class="input-button-container">
					<input type="text" name="inputPalindrome" id="inputPalindrome" />
					<button class="inputButton">Check</button>
				</div>
				<p class="isPalindromeText"></p>
			</div>
			<div class="info-card">
				<p>
					💡 A palindrome is a word or sentence that's spelled the same way both
					forward and backward, ignoring punctuation, case, and spacing.
				</p>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
