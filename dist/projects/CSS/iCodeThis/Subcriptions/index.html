<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Subcriptions Practice</title>
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<div class="main-card">
				<div class="top-container">
					<div class="title-container">
						<h2>Subcriptions</h2>
						<p>
							Support these creators by purchasing their monthly subcriptions
							and get access to premium content:
						</p>
					</div>
					<div class="tag-container">
						<div class="tag">
							<i class="fa fa-book"></i>
							<span>Source files</span>
						</div>
						<div class="tag">
							<i class="fa fa-mobile-screen"></i>
							<span>Live streams</span>
						</div>
						<div class="tag">
							<i class="fa fa-calendar"></i>
							<span>Meetup</span>
						</div>
					</div>
				</div>
				<div class="bottom-container">
					<i class="fa fa-arrow-left"></i>
					<div class="card-container">
						<div class="card">
							<img class="profile-image" src="FriendImage.png" alt="" />
							<h2 class="profile-name">Ludwig Lagos</h2>
							<p class="profile-job">Illustrator</p>
							<button class="btn-content">View content</button>
						</div>
						<div class="card">
							<img class="profile-image" src="FriendImage.png" alt="" />
							<h2 class="profile-name">Ludwig Lagos</h2>
							<p class="profile-job">Illustrator</p>
							<button class="btn-content">View content</button>
						</div>
						<div class="card">
							<img class="profile-image" src="FriendImage.png" alt="" />
							<h2 class="profile-name">Ludwig Lagos</h2>
							<p class="profile-job">Illustrator</p>
							<button class="btn-content">View content</button>
						</div>
					</div>
					<i class="fa fa-arrow-right"></i>
				</div>
			</div>
			<div class="background-card"></div>
		</div>
	</body>
</html>
