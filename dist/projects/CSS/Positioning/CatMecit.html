<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat</title>
  <link rel="stylesheet" href="CatMecit.css">
</head>

<body>
  <div class="main-cat">
    <div class="cat-head">
      <!-- KULAKLAR -->
      <div class="cat-ears">
        <div class="cat-left-ear">
          <div class="cat-left-ear-inside"></div>
        </div>
        <div class="cat-right-ear">
          <div class="cat-right-ear-inside"></div>
        </div>
      </div>

      <!-- GÖZLER -->
      <div class="cat-top">
        <div class="cat-left-eye-white"></div>
        <div class="cat-left-eye-black"></div>
        <div class="cat-right-eye-white"></div>
        <div class="cat-right-eye-black"></div>
      </div>

      <!-- BURUN & AĞIZ -->
      <div class="cat-bottom">
        <div class="cat-nose-main">
          <div class="cat-nose-cut-1"></div>
          <div class="cat-nose-cut-2"></div>
        </div>
        <div class="cat-mouth">
          <div class="cat-mouth-left">
            <div class="cat-main-mouth"></div>
          </div>
          <div class="cat-mouth-right">
            <div class="cat-main-mouth-2"></div>
          </div>
          <div class="cat-main-main">
            <div class="cat-beard-left">
              <div class="cat-1"></div>
              <div class="cat-2"></div>
              <div class="cat-3"></div>
            </div>
            <div class="cat-beard-right">
              <div class="cat-1"></div>
              <div class="cat-2"></div>
              <div class="cat-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
