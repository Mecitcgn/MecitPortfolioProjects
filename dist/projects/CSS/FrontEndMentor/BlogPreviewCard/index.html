<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Blog Preview Card</title>
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.css" />
		<link rel="stylesheet" href="../FontAwesomeWeb/css/all.min.css" />
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"

		/>

	<body>
		<div class="card">
			<div class="img-container">
				<img src="./assets/images/illustration-article.svg" alt="" />
			</div>
			<p class="learning">Learning</p>
			<p class="publish">Published 21 dev 2023</p>
			<h1 class="main-title">HTML & CSS foundations</h1>
			<p>
				These languages are the backbone of every website, defining structure,
				content, and presentation.
			</p>
			<div class="profile-container">
				<img
					src="./assets/images/image-avatar.webp"
					alt=""
					class="profile-img"
				/>
				<p class="profile-name">Greg Hooper</p>
			</div>
		</div>
	</body>
</html>
