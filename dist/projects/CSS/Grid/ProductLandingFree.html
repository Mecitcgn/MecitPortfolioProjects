<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="ProductLandingFree.css" />
</head>

<body>
  <!-- Header Section -->
  <header id="header">
    <img id="header-img" src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2015.png"
      alt="Company Logo" />
    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#video-section">How It Works</a>
      <a class="nav-link" href="#pricing">Pricing</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section id="features">
      <h2>Our Features</h2>
      <p>High-quality, reliable, and efficient products designed for you.</p>
    </section>

    <section id="video-section">
      <h2>Watch How It Works</h2>
      <iframe id="video" width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Product Video"
        frameborder="0" allowfullscreen></iframe>
    </section>

    <section id="pricing">
      <h2>Pricing Plans</h2>
      <div class="pricing-container">
        <div class="price-card">
          <h3>Basic</h3>
          <p>$9.99/month</p>
        </div>
        <div class="price-card">
          <h3>Pro</h3>
          <p>$19.99/month</p>
        </div>
        <div class="price-card">
          <h3>Enterprise</h3>
          <p>$29.99/month</p>
        </div>
      </div>
    </section>

    <!-- Form Section -->
    <section id="form-section">
      <h2>Join Our Newsletter</h2>
      <form id="form" action="https://www.freecodecamp.org/email-submit" method="post">
        <input id="email" name="email" type="email" placeholder="Enter your email address" required />
        <input id="submit" type="submit" value="Subscribe" />
      </form>
    </section>
  </main>
</body> 

</html>
