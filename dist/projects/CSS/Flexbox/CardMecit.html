<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game</title>
    <link rel="stylesheet" href="CardMecit.css">
</head>

<body>
    <main class="all-cards">
        <div class="first-card">
            <div class="left">
                <div>A</div>
                <div>♠</div>
            </div>
            <div class="middle">
                <div class="middle-text">♠</div>
            </div>
            <div class="right">
                <div>A</div>
                <div>♠</div>
            </div>
        </div>
        <div class="first-card">
            <div class="left">
                <div>2</div>
                <div>♣</div>
            </div>
            <div class="middle">
                <div class="middle-text">♣</div>
                <div class="middle-text-2">♣</div>
            </div>
            <div class="right">
                <div>2</div>
                <div>♣</div>
            </div>
        </div>
        <div class="first-card">
            <div class="left">
                <div>3</div>
                <div>♥</div>
            </div>
            <div class="middle">
                <div class="middle-text">♥</div>
                <div class="middle-text">♥</div>
                <div class="middle-text">♥</div>
            </div>
            <div class="right">
                <div>3</div>
                <div>♥</div>
            </div>
        </div>
        <div class="first-card">
            <div class="left">
                <div>4</div>
                <div>♣</div>
            </div>
            <div class="middle">
                <div class="middle-text">♣♣</div>
                <div class="middle-text">♣♣</div>
            </div>
            <div class="right">
                <div>4</div>
                <div>♣</div>
            </div>
        </div>
        <div class="first-card">
            <div class="left">
                <div>5</div>
                <div>♦</div>
            </div>
            <div class="middle">
                <div class="middle-text">♦♦</div>
                <div class="middle-text">♦</div>
                <div class="middle-text">♦♦</div>
            </div>
            <div class="right">
                <div>5</div>
                <div>♦</div>
            </div>
        </div>
    </main>
</body>

</html>
